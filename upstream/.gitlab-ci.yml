# The release version pattern, written once, as the input of .gitlab/ci/release-rules.yml. An input is put into the included file as text before any rule
# is evaluated, so that file builds the firmware release rule and the docs release rule, with docs- in front, from this one pattern. A variable does not
# work here: rules:if does not expand a variable whose value is built from another variable.
include:
  - local: .gitlab/ci/release-rules.yml
    inputs:
      version_pattern: '[0-9]{2}\.[0-9]{3}\.[0-9]{2}\.[0-9]{2}([ab][0-9]+)?(\..+)?'

default:
  image: ubuntu:25.10

stages:
  - build
  - test
  - upload
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/c47/${CI_COMMIT_TAG}"
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_FRONTEND: noninteractive

# ---------------------------------------------------------------------------
# Path gating
#
# docs/ now holds two document trees: the application notes and, since the
# manual moved here, a 260 page book that changes far more often than the
# firmware. Without a gate a chapter typo runs a macOS build.
#
# GitLab's `changes:` matcher is union only, with no negation, so the gate
# has to be a positive include list of what really builds the firmware
# rather than an exclusion of docs/. Add a path here when a new one starts
# feeding a build.
#
# A tag always builds everything, whatever changed: `upload` and `release`
# take the artefacts of these jobs, so a skipped build would publish an
# incomplete release.
# ---------------------------------------------------------------------------
.firmware-source-changes: &firmware-source-changes
  - src/**/*
  - res/**/*
  - dep/**/*
  - subprojects/**/*
  - tools/**/*
  - LIBRARY/**/*
  - PROGRAMS/**/*
  - Makefile
  - meson.build
  - meson_options.txt
  - tag2ver.py
  - .gitlab-ci.yml
  - .gitlab/ci/**/*

.firmware-rules: &firmware-rules
  - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^docs-/
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *firmware-source-changes
  - if: $CI_COMMIT_BRANCH
    changes: *firmware-source-changes

# The documents. TeX Live, with the Python and the Ghostscript of the TeX
# Live image for the screen crop: no pixi, no database, and no clone of
# this repository for the fonts, because res/fonts/ is in the tree the job
# already has.
#
# Two gates and two jobs, one per document tree. The manual is one
# document made of thirty files, so any of them is the whole book; a note
# is a document in a file of its own. Under one gate over both trees a
# note changing a line would build the 260 page book, and that is the
# trigger the split is here to avoid.
#
# The manual's gate is what the build reads and nothing else. `make pdf'
# is latexmk over docs/manual/tex and then the crop, so a file the
# document never opens cannot change a page of it: docs/manual/*.md, and
# docs/manual/tools/ with the checkers, which no job here runs, are out,
# and so is docs/refdb47/, whose data reaches the manual only through a
# local `make refdb47-data' that writes a file the repository has not
# got.
.docs-manual-changes: &docs-manual-changes
  # The document: the chapters, figures/, the program listings, the four
  # menu images and .latexmkrc.
  - docs/manual/tex/**/*
  # latexmk's flags, TEXINPUTS, C47_FONT_DIR, the paper, the crop.
  - docs/manual/Makefile
  - docs/styles/**/*
  # The calculator's own faces, which the document opens by name through
  # C47_FONT_DIR. A changed glyph changes every key the manual prints.
  # `res/**/*' in the firmware list above is a gate for other jobs.
  - res/fonts/**/*
  # pdfcrop-uniform.py sets the page of the crop, ci-diff.sh and
  # latexdiff-build.py write the marked-up build.
  - docs/tools/**/*
  - .gitlab-ci.yml
  - .gitlab/ci/**/*

# A note is built from its own source and the marked-up build shows what
# that source changed, so the source is the gate. The shared styles are
# in the manual's list above and are not in this one: a style change
# leaves every note source as it was, and a diff of a file against itself
# is an unmarked copy of the note. The screens and the program listings
# are out for the same reason, since latexdiff marks text.
.docs-appnotes-changes: &docs-appnotes-changes
  - docs/appnotes/sources/**/*.ltx
  # A note's own .tex, such as AN0007's revblock.tex, which the Internal
  # Notes includes with \input. *.ltx above does not match it, and ci-diff.sh
  # builds the note that includes it.
  - docs/appnotes/sources/**/*.tex
  # The build scripts, the marked-up build's own machinery and this file.
  # Where one of them changes and no note does, ci-diff.sh builds one note
  # to try the note path, which is not the manual path.
  - docs/appnotes/sources/build-note-*.sh
  - docs/tools/**/*
  - .gitlab-ci.yml
  - .gitlab/ci/**/*

macOS:
  stage: build
  rules: *firmware-rules
  image: macos-26-xcode-26
  script:
    - HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install ccache ninja python@3.9 gtk+3 gmp pulseaudio xlsxio
    - pip3 install --upgrade pip
    - python3 -m pip install --user meson==1.7.2
    - USER_BASE_BIN=$(python3 -m site --user-base)/bin
    - export PATH="$USER_BASE_BIN:$PATH"  # Add local bin to PATH
    - make dist_macos
  artifacts:
    expire_in: 1 day
    paths:
      - c47-macos.zip
  tags:
    - saas-macos-medium-m1

.linux-script-before: &linux-script-before
  - apt-get update -qq
  - apt-get install -qq -y git zip
  - apt-get install -qq -y pkgconf build-essential ninja-build meson
  - apt-get install -qq -y cmake libgmp-dev libgtk-3-dev
  - apt-get install -qq -y xvfb libminizip-dev
  - git clone https://github.com/brechtsanders/xlsxio.git           # Compilation and installation of xlsxio
  - cd xlsxio/build && cmake .. && make && make install && cd ../.. # needed to convert sortingOrder.xlsx to csv
  - ldconfig

linux:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y libpulse-dev
  script:
    - make XVFB=xvfb-run dist_linux
  artifacts:
    expire_in: 1 day
    paths:
      - c47-linux.zip
  tags:
    - saas-linux-small-amd64

windows:
  stage: build
  rules: *firmware-rules
  script:
    - C:\msys64\msys2_shell.cmd -defterm -ucrt64 -no-start -here -c "make dist_windows"
  artifacts:
    expire_in: 1 day
    paths:
      - c47-windows.zip
  tags:
    - c47_windows

dmcp:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp
  artifacts:
    expire_in: 1 day
    paths:
      - "c47-dmcp-pkg?.zip"
  tags:
    - saas-linux-small-amd64

dmcp5:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp5
  artifacts:
    expire_in: 1 day
    paths:
      - c47-dmcp5.zip
  tags:
    - saas-linux-small-amd64

dmcp5r47:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp5r47
  artifacts:
    expire_in: 1 day
    paths:
      - r47-dmcp5.zip
  tags:
    - saas-linux-small-amd64

testSuite:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
  script:
    - make test
  tags:
    - saas-linux-small-amd64

codeDocs:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y doxygen python3-sphinx python3-breathe furo
  script:
    - make docs

# The manual: the A4 build that releases, the screen crop beside it, and
# the same document again with every change the branch makes to it marked
# on the page. docs/tools/ci-diff.sh writes the third one and says there
# why a release tag gets only the first two.
docs-manual:
  stage: build
  image: texlive/texlive:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # The marked-up build test merges the branch onto its target branch,
    # and a merge needs a common ancestor, which a shallow clone has not.
    GIT_DEPTH: 0
  rules:
    - !reference [.docs-release-rules, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docs-manual-changes
    - if: $CI_COMMIT_BRANCH
      changes: *docs-manual-changes
  script:
    - make -C docs/manual pdf VARIANT=crop
    - docs/tools/ci-diff.sh manual
  artifacts:
    expire_in: 1 week
    paths:
      - docs/manual/C47_R47_calc.pdf
      - docs/manual/C47_R47_calc_Crop.pdf
      # Written in a merge request, on a branch, and on the default
      # branch, where the comparison is the revision before the push. A
      # release tag has no predecessor in the clone, so there this file
      # is missing and the job reports that rather than failing.
      - docs/manual/C47_R47_calc_Diff_Crop.pdf
  tags:
    - saas-linux-small-amd64

# The application notes, and only the ones the branch changes. Each is
# built the way it publishes, by its own build script and the same crop,
# with the changes marked. The note's own PDF is in the repository and is
# rebuilt by hand when it publishes, so the marked-up build is the only
# one this job writes.
docs-appnotes:
  stage: build
  image: texlive/texlive:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docs-appnotes-changes
    - if: $CI_COMMIT_BRANCH
      changes: *docs-appnotes-changes
  before_script:
    # A note is built by sources/build-note-100.sh, which is zsh, and the
    # image carries no promise of one. Installed only when it is missing,
    # so an image that has it pays nothing.
    - command -v zsh > /dev/null || { apt-get update -qq && apt-get install -qq -y zsh; }
  script:
    - docs/tools/ci-diff.sh appnotes
  artifacts:
    expire_in: 1 week
    paths:
      - docs/appnotes/*_Diff_Crop.pdf
  tags:
    - saas-linux-small-amd64

# A docs release tag is docs- followed by a firmware release version, such as docs-00.109.04.00b0.RC1, and it releases the documents under docs/ and
# nothing else. No firmware job, no firmware upload and no firmware release runs for any tag that begins with docs-, and a docs- tag without a release
# version after it starts no job at all. The rule is .docs-release-rules in .gitlab/ci/release-rules.yml.
#
# The docs-manual job builds, on such a tag as on a branch. docs-stage builds nothing: `make -C docs release` copies the PDFs that docs/release.tsv lists,
# from the artefacts of docs-manual, into docs/release/ under their release names with a VERSION file. docs-upload and docs-release publish what it wrote.
docs-stage:
  stage: upload
  image: alpine:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
  extends: .docs-release-rules
  needs:
    - job: docs-manual
      artifacts: true
  before_script:
    - apk add --no-cache make
  script:
    - make -C docs release
  artifacts:
    expire_in: 1 week
    paths:
      - docs/release/
  tags:
    - saas-linux-small-amd64

docs-upload:
  stage: upload
  image: curlimages/curl:latest
  extends: .docs-release-rules
  needs:
    - job: docs-stage
      artifacts: true
  script:
    - |
      VERSION=$(cat docs/release/VERSION)
      for f in docs/release/*.pdf
      do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${f} "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/c47-docs/${VERSION}/$(basename ${f})"
      done
  tags:
    - saas-linux-small-amd64

docs-release:
  stage: release
  image: gitlab/glab:latest
  extends: .docs-release-rules
  needs:
    - job: docs-stage
      artifacts: true
    - job: docs-upload
      artifacts: false
  script:
    - |
      VERSION=$(cat docs/release/VERSION)
      ASSETLINKS=""
      for f in docs/release/*.pdf
      do
        n=$(basename ${f})
        ASSETLINKS="${ASSETLINKS}{\"name\":\"${n}\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/c47-docs/${VERSION}/${n}\",\"link_type\":\"package\"},"
      done
      ASSETLINKS="[${ASSETLINKS%,}]"
      echo "${ASSETLINKS}"
      glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_HOST --api-protocol $CI_SERVER_PROTOCOL
      GITLAB_HOST=$CI_SERVER_URL glab release create ${CI_COMMIT_TAG} --name "Documents ${VERSION}" --notes "C47/R47 owner's manual ${VERSION}, on A4 and cropped for the screen." --assets-links "${ASSETLINKS}" --repo $CI_PROJECT_PATH
  tags:
    - saas-linux-small-amd64

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^docs-/
  script:
    - |
      for f in *.zip
      do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${f} ${PACKAGE_REGISTRY_URL}/$(basename ${f} .zip)-${CI_COMMIT_TAG}.zip
      done
  tags:
    - saas-linux-small-amd64

release:
  stage: release
  image: gitlab/glab:latest
  extends: .firmware-release-rules
  script:
    - >
      PKGS="c47-dmcp-pkg?.zip"; FIRST=1

      ASSETLINKS="[
      {\"name\":\"Windows Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-windows-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"Linux Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-linux-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"macOS Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-macos-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"C47 Firmware for DMCP5 (DM42n)\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-dmcp5-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"R47 Firmware for DMCP5 (R47)\",\"url\":\"${PACKAGE_REGISTRY_URL}/r47-dmcp5-${CI_COMMIT_TAG}.zip\"},
      $(
        for f in ${PKGS}; do
          [ ${FIRST}"" = "" ] && printf ,\\n;
          unset FIRST;
          echo -n "{\"name\":\"C47 Firmware for DMCP  (DM42) - $(echo ${f} | cut -c 10-13)\",\"url\":\"${PACKAGE_REGISTRY_URL}/$(basename ${f} .zip)-${CI_COMMIT_TAG}.zip\"}";
        done
        )
      ]"

      echo ${ASSETLINKS}

      glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_HOST --api-protocol $CI_SERVER_PROTOCOL

      GITLAB_HOST=$CI_SERVER_URL glab release create ${CI_COMMIT_TAG} --name "Release ${CI_COMMIT_TAG}" --notes "C47/R47 release ${CI_COMMIT_TAG}" --assets-links "${ASSETLINKS}" --repo $CI_PROJECT_PATH
  tags:
    - saas-linux-small-amd64
