default:
  image: ubuntu:25.10

stages:
  - build
  - test
  - upload
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/c47/${CI_COMMIT_TAG}"
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_FRONTEND: noninteractive

# ---------------------------------------------------------------------------
# Path gating
#
# docs/ now holds two document trees: the application notes and, since the
# manual moved here, a 260 page book that changes far more often than the
# firmware. Without a gate a chapter typo runs a macOS build.
#
# GitLab's `changes:` matcher is union only, with no negation, so the gate
# has to be a positive include list of what really builds the firmware
# rather than an exclusion of docs/. Add a path here when a new one starts
# feeding a build.
#
# A tag always builds everything, whatever changed: `upload` and `release`
# take the artefacts of these jobs, so a skipped build would publish an
# incomplete release.
# ---------------------------------------------------------------------------
.firmware-source-changes: &firmware-source-changes
  - src/**/*
  - res/**/*
  - dep/**/*
  - subprojects/**/*
  - tools/**/*
  - LIBRARY/**/*
  - PROGRAMS/**/*
  - Makefile
  - meson.build
  - meson_options.txt
  - tag2ver.py
  - .gitlab-ci.yml

.firmware-rules: &firmware-rules
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *firmware-source-changes
  - if: $CI_COMMIT_BRANCH
    changes: *firmware-source-changes

# The owner's manual. TeX Live and nothing else: no Python, no pixi, no
# database, and no clone of this repository for the fonts, because
# res/fonts/ is in the tree the job already has.
.manual-source-changes: &manual-source-changes
  - docs/manual/**/*
  - docs/styles/**/*
  - docs/refdb47/data/**/*
  - .gitlab-ci.yml

macOS:
  stage: build
  rules: *firmware-rules
  image: macos-26-xcode-26
  script:
    - HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install ccache ninja python@3.9 gtk+3 gmp pulseaudio xlsxio
    - pip3 install --upgrade pip
    - python3 -m pip install --user meson==1.7.2
    - USER_BASE_BIN=$(python3 -m site --user-base)/bin
    - export PATH="$USER_BASE_BIN:$PATH"  # Add local bin to PATH
    - make dist_macos
  artifacts:
    expire_in: 1 day
    paths:
      - c47-macos.zip
  tags:
    - saas-macos-medium-m1

.linux-script-before: &linux-script-before
  - apt-get update -qq
  - apt-get install -qq -y git zip
  - apt-get install -qq -y pkgconf build-essential ninja-build meson
  - apt-get install -qq -y cmake libgmp-dev libgtk-3-dev
  - apt-get install -qq -y xvfb libminizip-dev
  - git clone https://github.com/brechtsanders/xlsxio.git           # Compilation and installation of xlsxio
  - cd xlsxio/build && cmake .. && make && make install && cd ../.. # needed to convert sortingOrder.xlsx to csv
  - ldconfig

linux:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y libpulse-dev
  script:
    - make XVFB=xvfb-run dist_linux
  artifacts:
    expire_in: 1 day
    paths:
      - c47-linux.zip
  tags:
    - saas-linux-small-amd64

windows:
  stage: build
  rules: *firmware-rules
  script:
    - C:\msys64\msys2_shell.cmd -defterm -ucrt64 -no-start -here -c "make dist_windows"
  artifacts:
    expire_in: 1 day
    paths:
      - c47-windows.zip
  tags:
    - c47_windows

dmcp:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp
  artifacts:
    expire_in: 1 day
    paths:
      - "c47-dmcp-pkg?.zip"
  tags:
    - saas-linux-small-amd64

dmcp5:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp5
  artifacts:
    expire_in: 1 day
    paths:
      - c47-dmcp5.zip
  tags:
    - saas-linux-small-amd64

dmcp5r47:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y gcc-arm-none-eabi
  script:
    - make XVFB=xvfb-run dist_dmcp5r47
  artifacts:
    expire_in: 1 day
    paths:
      - r47-dmcp5.zip
  tags:
    - saas-linux-small-amd64

testSuite:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
  script:
    - make test
  tags:
    - saas-linux-small-amd64

codeDocs:
  stage: build
  rules: *firmware-rules
  before_script:
    - *linux-script-before
    - apt-get install -qq -y doxygen python3-sphinx python3-breathe furo
  script:
    - make docs

manual:
  stage: build
  image: texlive/texlive:latest
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *manual-source-changes
    - if: $CI_COMMIT_BRANCH
      changes: *manual-source-changes
  script:
    - make -C docs/manual pdf
  artifacts:
    expire_in: 1 week
    paths:
      - docs/manual/C47_R47_calc.pdf
  tags:
    - saas-linux-small-amd64

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in *.zip
      do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${f} ${PACKAGE_REGISTRY_URL}/$(basename ${f} .zip)-${CI_COMMIT_TAG}.zip
      done
  tags:
    - saas-linux-small-amd64

release:
  stage: release
  image: gitlab/glab:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]{2}\.[0-9]{3}\.[0-9]{2}\.[0-9]{2}([abr][c0-9][0-9]?(\..*)?)?$/
  script:
    - >
      PKGS="c47-dmcp-pkg?.zip"; FIRST=1

      ASSETLINKS="[
      {\"name\":\"Windows Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-windows-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"Linux Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-linux-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"macOS Simulator\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-macos-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"C47 Firmware for DMCP5 (DM42n)\",\"url\":\"${PACKAGE_REGISTRY_URL}/c47-dmcp5-${CI_COMMIT_TAG}.zip\"},
      {\"name\":\"R47 Firmware for DMCP5 (R47)\",\"url\":\"${PACKAGE_REGISTRY_URL}/r47-dmcp5-${CI_COMMIT_TAG}.zip\"},
      $(
        for f in ${PKGS}; do
          [ ${FIRST}"" = "" ] && printf ,\\n;
          unset FIRST;
          echo -n "{\"name\":\"C47 Firmware for DMCP  (DM42) - $(echo ${f} | cut -c 10-13)\",\"url\":\"${PACKAGE_REGISTRY_URL}/$(basename ${f} .zip)-${CI_COMMIT_TAG}.zip\"}";
        done
        )
      ]"

      echo ${ASSETLINKS}

      glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_HOST --api-protocol $CI_SERVER_PROTOCOL

      GITLAB_HOST=$CI_SERVER_URL glab release create ${CI_COMMIT_TAG} --name "Release ${CI_COMMIT_TAG}" --notes "C47/R47 release ${CI_COMMIT_TAG}" --assets-links "${ASSETLINKS}" --repo $CI_PROJECT_PATH
  tags:
    - saas-linux-small-amd64
