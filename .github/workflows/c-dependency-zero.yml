name: c-dependency-zero

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig-c-boundary-guard:
    name: Verify curated Zig/C boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce approved Zig/C boundary files
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-zig-c-boundaries.sh

  c-dependency-zero:
    name: Verify zero first-party C dependencies
    runs-on: ubuntu-latest
    needs:
      - zig-c-boundary-guard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce zero first-party C dependency cap
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/project/check-c-dependency-allowlist.py --repo-root . --config .github/project/c-dependency-allowlist.json --max-first-party 0
      - name: Self-test the live-link product C isolation checker
        shell: bash
        run: |
          set -euo pipefail
          # Guards the checker logic itself. The full graph check
          # (verify-product-c-link-isolation.py --target sim) requires a built
          # toolchain and runs in the build lane / locally; this step keeps the
          # literal-scan-independent verifier honest without a build.
          python3 .github/project/verify-product-c-link-isolation.py --self-test
