name: c-dependency-zero

on:
  workflow_dispatch:

jobs:
  c-dependency-zero:
    name: Verify zero first-party C dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce zero first-party C dependency cap
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/project/check-c-dependency-allowlist.py --repo-root . --config .github/project/c-dependency-allowlist.json --max-first-party 0
