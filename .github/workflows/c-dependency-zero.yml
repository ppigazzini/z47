name: c-dependency-zero

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig-c-boundary-guard:
    name: Verify curated Zig/C boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce approved Zig/C boundary files
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-zig-c-boundaries.sh

  c-dependency-zero:
    name: Verify zero first-party C dependencies
    runs-on: ubuntu-latest
    needs:
      - zig-c-boundary-guard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce zero first-party C dependency cap
        shell: bash
        run: |
          set -euo pipefail
          # Run the committed policy script, the same one the local pre-push gate
          # calls, so CI and local cannot drift. It enforces the strict zero cap
          # on the PRODUCT graph -- which is what "zero first-party C" means, and
          # is currently 0 -- and baseline/no-regression on the wider config,
          # whose entries are test-harness and oracle C (60 of them). Pointing
          # the zero cap at that wider config, as this step used to, could never
          # pass: it read 411 on the commit that introduced it and 60 today.
          bash .github/project/check-c-dependency-phase-i-policy.sh .
      - name: Self-test the live-link product C isolation checker
        shell: bash
        run: |
          set -euo pipefail
          # Guards the checker logic itself. The full graph check
          # (verify-product-c-link-isolation.py --target sim) requires a built
          # toolchain and runs in the build lane / locally; this step keeps the
          # literal-scan-independent verifier honest without a build.
          python3 .github/project/verify-product-c-link-isolation.py --self-test
