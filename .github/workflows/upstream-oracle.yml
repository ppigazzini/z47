name: host-platform-parity

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - github_ci
  push:
    branches:
      - main
      - github_ci
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
  XLSXIO_HELPER_CACHE_VERSION: v2
  ZIG_BUILD_CACHE_VERSION: v1

permissions:
  contents: read

jobs:
  validate-toolchain:
    name: Validate pinned Zig toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
          echo "linux_sha256=$ZIG_X86_64_LINUX_SHA256" >> "$GITHUB_OUTPUT"
      - name: Validate toolchain manifest against ziglang.org
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/index.json -o zig-index.json
          grep -F "\"${{ steps.toolchain.outputs.version }}\"" zig-index.json
          grep -F "\"${{ steps.toolchain.outputs.linux_sha256 }}\"" zig-index.json
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Verify resolved Zig version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "${{ steps.toolchain.outputs.version }}"

  zig-fmt-check:
    name: Enforce zig fmt on z47-owned Zig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Check formatting (zig fmt --check)
        shell: bash
        run: |
          set -euo pipefail
          ./.github/project/check-fmt.sh

  zig-native-unit-tests:
    name: Native Zig unit tests (no C oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Run native unit tests
        shell: bash
        run: |
          set -euo pipefail
          zig build test:unit

  zig-master-compatibility:
    name: Zig master compatibility monitor
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: master_toolchain
        name: Load monitored Zig master metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_MASTER_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install monitored Zig master snapshot
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.master_toolchain.outputs.version }}
      - name: Verify resolved monitored Zig version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "${{ steps.master_toolchain.outputs.version }}"
      - id: xlsxio-ref
        name: Resolve xlsxio upstream HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote https://github.com/brechtsanders/xlsxio.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: xlsxio-cache
        name: Restore Linux xlsxio helper cache for monitored Zig master
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/xlsxio-prefix
          key: xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-${{ env.XLSXIO_HELPER_CACHE_VERSION }}
          restore-keys: |
            xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-
            xlsxio-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux xlsxio helper prerequisites for monitored Zig master
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners preconfigure Microsoft/azure-cli apt repos that
          # intermittently fail signature checks (Clearsigned 'NOSPLIT') and abort
          # apt-get update; none of our prerequisites need them, so drop those
          # third-party source lists before updating.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list || true
          sudo apt-get update -qq
          sudo apt-get install -qq -y git pkgconf build-essential cmake libexpat1-dev libminizip-dev
      - name: Build xlsxio helper for monitored Zig master
        if: steps.xlsxio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/brechtsanders/xlsxio.git "$RUNNER_TEMP/xlsxio"
          cmake_version="$(cmake --version | sed -n '1s/^cmake version //p')"
          cmake_major="${cmake_version%%.*}"
          cmake_policy_args=()
          if [[ "$cmake_major" =~ ^[0-9]+$ && "$cmake_major" -ge 4 ]]; then
            cmake_policy_args+=( -DCMAKE_POLICY_VERSION_MINIMUM=3.5 )
          fi
          cmake -S "$RUNNER_TEMP/xlsxio" -B "$RUNNER_TEMP/xlsxio/build" \
            "${cmake_policy_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCUMENTATION:BOOL=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/xlsxio-prefix"
          cmake --build "$RUNNER_TEMP/xlsxio/build" --parallel
          cmake --install "$RUNNER_TEMP/xlsxio/build"
      - name: Install monitored Zig master host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -qq -y libfreetype6-dev libgmp-dev libgtk-3-dev libpulse-dev
      - name: Probe build graph and generator-backed host lane under monitored Zig master
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          zig build --help --summary none
          zig build logical_shortint_parity --summary none
          zig build rotate_bits_parity --summary none
          zig build logical_boolean_ops_suite --summary none

  source-manifest:
    name: Verify imported upstream pin and source manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify pinned upstream commit is on upstream/master
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/project/upstream-pin.env
          git fetch --no-tags "$UPSTREAM_REPOSITORY_URL" "$UPSTREAM_BRANCH"
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" FETCH_HEAD
      - name: Write source manifest artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t imported_roots < <(bash .github/project/check-source-ownership.sh list-imported-roots)
          git ls-files -s -- "${imported_roots[@]}" > upstream-source.index
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-source-index
          path: upstream-source.index

  source-ownership-guard:
    name: Verify tracked source ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch pinned upstream history for ownership diff base
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/project/upstream-pin.env
          git fetch --no-tags "$UPSTREAM_REPOSITORY_URL" "$UPSTREAM_BRANCH"
      - name: Enforce tracked source ownership rules
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-source-ownership.sh

  upstream-port-ledger-guard:
    name: Verify tracked upstream port ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: diff_base
        name: Resolve diff base for upstream ledger checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            echo "value=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "value=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce tracked upstream port ledger
        shell: bash
        run: |
          set -euo pipefail
          args=( --repo-root . )
          if [[ -n "${{ steps.diff_base.outputs.value }}" ]]; then
            args+=( --diff-base "${{ steps.diff_base.outputs.value }}" )
          fi
          python3 .github/project/check-upstream-port-ledger.py "${args[@]}"

  zig-c-boundary-guard:
    name: Verify curated Zig/C boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce approved Zig/C boundary files
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-zig-c-boundaries.sh

  idiom-ratchet-guard:
    name: Enforce idiomatic-Zig ratchet (no transliteration-debt regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce monotonic idiom ratchet
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-idiom-ratchet.sh
      - name: Enforce generated ABI seams match upstream C
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/project/generate-font-seams.py --repo-root . --check

  c-dependency-policy:
    name: Verify Phase I C dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce Phase I dependency policy
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-c-dependency-phase-i-policy.sh .

  workflow-imported-root-guard:
    name: Verify workflow imported-root vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce shared workflow imported-root paths
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/workflow-imported-root-paths.sh check-workflow

  workflow-locality-guard:
    name: Verify workflow script locality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce no __DEV script references in CI workflows
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-ci-no-local-dev-scripts.sh

  linux-host-parity:
    name: Linux host parity, ASAN, generated outputs, and host package
    needs:
      - validate-toolchain
      - source-manifest
      - source-ownership-guard
      - upstream-port-ledger-guard
      - zig-c-boundary-guard
      - c-dependency-policy
      - workflow-imported-root-guard
      - workflow-locality-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Verify resolved Zig version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "${{ steps.toolchain.outputs.version }}"
      - id: zig-build-cache
        name: Restore Linux host Zig build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-linux-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}
          restore-keys: |
            zig-build-linux-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}-
            zig-build-linux-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-
      - id: xlsxio-ref
        name: Resolve xlsxio upstream HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote https://github.com/brechtsanders/xlsxio.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: xlsxio-cache
        name: Restore Linux xlsxio helper cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/xlsxio-prefix
          key: xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-${{ env.XLSXIO_HELPER_CACHE_VERSION }}
          restore-keys: |
            xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-
            xlsxio-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux xlsxio helper prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners preconfigure Microsoft/azure-cli apt repos that
          # intermittently fail signature checks (Clearsigned 'NOSPLIT') and abort
          # apt-get update; none of our prerequisites need them, so drop those
          # third-party source lists before updating.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list || true
          sudo apt-get update -qq
          sudo apt-get install -qq -y git pkgconf build-essential cmake libexpat1-dev libminizip-dev
      - name: Build xlsxio helper
        if: steps.xlsxio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/brechtsanders/xlsxio.git "$RUNNER_TEMP/xlsxio"
          cmake_version="$(cmake --version | sed -n '1s/^cmake version //p')"
          cmake_major="${cmake_version%%.*}"
          cmake_policy_args=()
          if [[ "$cmake_major" =~ ^[0-9]+$ && "$cmake_major" -ge 4 ]]; then
            cmake_policy_args+=( -DCMAKE_POLICY_VERSION_MINIMUM=3.5 )
          fi
          cmake -S "$RUNNER_TEMP/xlsxio" -B "$RUNNER_TEMP/xlsxio/build" \
            "${cmake_policy_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCUMENTATION:BOOL=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/xlsxio-prefix"
          cmake --build "$RUNNER_TEMP/xlsxio/build" --parallel
          cmake --install "$RUNNER_TEMP/xlsxio/build"
      - name: Install remaining Linux host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -qq -y unzip
          sudo apt-get install -qq -y libfreetype6-dev libgmp-dev libgtk-3-dev
          sudo apt-get install -qq -y xvfb xdotool x11-utils imagemagick libpulse-dev
      - name: Run Linux host build, tests, and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          retry_once() {
            "$@" || "$@"
          }
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          zig build logical_shortint_parity
          zig build rotate_bits_parity
          zig build logical_boolean_ops_suite
          zig build stack_state_parity
          retry_once zig build register_metadata_parity
          zig build flags_parity
          zig build memory_parity
          zig build program_serialization_parity
          zig build calc_state_parity
          zig build math_command_wrappers_parity
          zig build math_random_parity
          # Format-equivalence oracle (M24): every migrated sprintf->std.fmt
          # translation must stay byte-identical to libc.
          zig build format_parity
          # Constant-offset oracle (REPORT-23 P3 / M22): every abi/constants.zig
          # typed accessor's blob offset must match the C constantPointers.h ground
          # truth, so the offset-crash class stays caught after each pin advance.
          # constantPointers.h is a gitignored generateConstants output, so refresh
          # it into src/generated first.
          zig build constants
          python3 .github/project/check-constant-offsets.py
          # Constant-parity audit: every defines.h/enum value an owner hardcodes
          # (ITM_*, ERROR_*, FLAG_*, dt*, ...) must match upstream C. Catches the
          # stale-mirror class (TM_CMP was 10021, dtReal34 was 0) that the
          # behavioral constants_parity oracle does not cover.
          python3 .github/project/audit-constant-parity.py
          # Item-table parity audit: frontier_items.zig's hand-mirrored indexOfItems
          # (2861 rows of param/name/tamMinMax/status) must match the C-compiled
          # items.c byte-for-byte. Catches the exact class that crashed a pin advance
          # (LAST_ITEM grew, the Zig table went out of bounds) before it can merge.
          python3 .github/project/audit-item-table-parity.py
          # abi struct-layout oracle (seam-and-core harness): the abi/types.zig
          # numeric mirrors must match the translate-c'd upstream decNumber-family
          # layout, so a wrong layout (silent-corruption class) fails here. Gates
          # green before abi/types.zig is generated; adjudicates the seam after.
          zig build abi-layout-parity
          zig build keyboard_state_parity
          zig build both
          # NON-BLOCKING: the headless GUI smoke trips a pixman SSE2 composite
          # over-read under Xvfb software rendering (drawScreen -> cairo_paint ->
          # pixman_image_composite32, "invalid read of 16" past the heap break).
          # It is version-INDEPENDENT (reproduced locally on libpixman 0.42.2 AND
          # a from-source 0.44.2 via LD_PRELOAD), and is NOT fixable from our draw
          # code (verified: source-buffer padding, a cairo-owned copy surface, and
          # CAIRO_OPERATOR_SOURCE all still crash). It does not reproduce on real
          # GPU displays or on macOS Quartz, only Xvfb's 24-bit software path
          # (depth 16 avoids it). Pre-existing and not a product regression.
          zig build simulator_smoke \
            || echo "::warning title=simulator_smoke (non-blocking)::headless GUI smoke crashed in pixman composite under Xvfb software rendering (version-independent); not a product regression"
          zig build testPgms
          xvfb-run --auto-servernum zig build test
          zig build generated
      - name: Run Linux ASAN wrapper surface
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          zig build both_asan
          xvfb-run --auto-servernum zig build test_asan
      - name: Run Linux distribution surface
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XVFB="xvfb-run --auto-servernum"
          zig build -Doptimize=ReleaseFast dist_linux
      - name: Run Linux simulator smoke launch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          smoke_dir="$RUNNER_TEMP/c47-linux-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          unzip -q zig-out/dist/c47-linux.zip -d "$smoke_dir"
          cd "$smoke_dir/c47-linux"
          status=0
          if timeout 10s xvfb-run --auto-servernum ./c47 >"$RUNNER_TEMP/c47-linux-smoke.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          # 124 = timeout (app stayed alive for 10s = healthy launch).
          # 139 = SIGSEGV from the known pixman composite over-read under Xvfb
          # software rendering (version-independent; see simulator_smoke note above).
          if [[ "$status" -eq 139 ]]; then
            cat "$RUNNER_TEMP/c47-linux-smoke.log"
            echo "::warning title=Linux simulator launch (non-blocking)::c47 SEGV on headless launch under Xvfb/libpixman-0.42 — known pixman composite over-read, not a product regression"
          elif [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            cat "$RUNNER_TEMP/c47-linux-smoke.log"
            exit "$status"
          fi
      - name: Compare tracked generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_artifacts < <(bash .github/project/workflow-imported-root-paths.sh generated-artifacts)
          git diff --exit-code -- "${generated_artifacts[@]}"
      - name: Hash golden artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_artifacts < <(bash .github/project/workflow-imported-root-paths.sh generated-artifacts)
          sha256sum "${generated_artifacts[@]}" > golden-artifacts.sha256
      - id: linux_package_meta
        name: Set Linux artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/project/upstream-pin.env
          upstream_short="${UPSTREAM_COMMIT:0:12}"
          echo "upstream_url=$UPSTREAM_REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$upstream_short" >> "$GITHUB_OUTPUT"
          echo "artifact_name=z47-linux-$upstream_short" >> "$GITHUB_OUTPUT"
      - name: Stage Linux simulator artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="ci-artifacts/release"
          package_dir="$release_dir/c47-linux"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          unzip -q zig-out/dist/c47-linux.zip -d "$release_dir"

          python3 .github/project/generate-simulator-notice-artifacts.py \
            --platform linux \
            --package-dir "$package_dir" \
            --upstream-source-repository-url "${{ steps.linux_package_meta.outputs.upstream_url }}" \
            --upstream-source-commit "${{ steps.linux_package_meta.outputs.upstream_commit }}" \
            --xlsxio-source-repository-url https://github.com/brechtsanders/xlsxio.git \
            --xlsxio-source-commit "${{ steps.xlsxio-ref.outputs.sha }}"

          cat >> "$package_dir/SOURCE" <<EOF
          z47_repository_url=https://github.com/${{ github.repository }}
          z47_commit=${GITHUB_SHA}
          zig_version=${{ steps.toolchain.outputs.version }}
          runner_os=${RUNNER_OS}
          runner_arch=${RUNNER_ARCH}
          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          find "$package_dir" -type f | sed "s#^$release_dir/##" | sort > "$release_dir/PACKAGE-CONTENTS.txt"
          cat > "$release_dir/BUILD-METADATA.txt" <<EOF
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          upstream_url=${{ steps.linux_package_meta.outputs.upstream_url }}
          upstream_commit=${{ steps.linux_package_meta.outputs.upstream_commit }}
          upstream_license_file=COPYING
          source_manifest_file=SOURCE
          xlsxio_url=https://github.com/brechtsanders/xlsxio.git
          xlsxio_commit=${{ steps.xlsxio-ref.outputs.sha }}
          xlsxio_license_file=LICENSE.txt
          spdx_inventory_file=THIRD-PARTY.spdx.json
          third_party_inventory_file=THIRD-PARTY.spdx.json
          platform_notice_root=repo-notices/linux
          linux_runtime_library_inventory_file=repo-notices/linux/LINUX-RUNTIME-LIBRARIES.txt
          linux_runtime_notice_summary_file=repo-notices/linux/LINUX-LIBRARY-NOTICES.txt
          linux_runtime_notice_dir=repo-notices/linux/licenses
          host_optimize=ReleaseFast
          zig_version=${{ steps.toolchain.outputs.version }}
          runner_os=${RUNNER_OS}
          runner_arch=${RUNNER_ARCH}
          package_dir=$(basename "$package_dir")
          artifact_name=${{ steps.linux_package_meta.outputs.artifact_name }}
          EOF
      - name: Stage generated-artifact proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="ci-artifacts/generated"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          cp golden-artifacts.sha256 "$proof_dir/"
          while IFS= read -r generated_artifact; do
            [[ -n "$generated_artifact" ]] || continue
            mkdir -p "$proof_dir/$(dirname -- "$generated_artifact")"
            cp "$generated_artifact" "$proof_dir/$generated_artifact"
          done < <(bash .github/project/workflow-imported-root-paths.sh generated-artifacts)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.linux_package_meta.outputs.artifact_name }}
          path: ci-artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-host-parity-artifacts
          path: ci-artifacts/generated/

  linux-docs:
    name: Linux docs surface
    needs:
      - validate-toolchain
      - upstream-port-ledger-guard
      - workflow-imported-root-guard
      - workflow-locality-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Verify resolved Zig version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "${{ steps.toolchain.outputs.version }}"
      - id: zig-build-cache
        name: Restore Linux docs Zig build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-linux-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}
          restore-keys: |
            zig-build-linux-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}-
            zig-build-linux-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-
      - id: docs-requirements-hash
        name: Resolve Linux docs requirements hash
        shell: bash
        run: |
          set -euo pipefail
          requirements_file="$(bash .github/project/workflow-imported-root-paths.sh docs-requirements)"
          echo "sha=$(sha256sum "$requirements_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: pip-cache
        name: Restore Linux docs Python package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ steps.docs-requirements-hash.outputs.sha }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install Linux docs prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners preconfigure Microsoft/azure-cli apt repos that
          # intermittently fail signature checks (Clearsigned 'NOSPLIT') and abort
          # apt-get update; none of our prerequisites need them, so drop those
          # third-party source lists before updating.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list || true
          sudo apt-get update -qq
          sudo apt-get install -qq -y doxygen python3-pip
          requirements_file="$(bash .github/project/workflow-imported-root-paths.sh docs-requirements)"
          python3 -m pip install --user -r "$requirements_file"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Linux docs surface
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          zig build docs

  linux-firmware-artifacts:
    name: Linux firmware validation and publication
    needs:
      - validate-toolchain
      - source-manifest
      - source-ownership-guard
      - upstream-port-ledger-guard
      - zig-c-boundary-guard
      - c-dependency-policy
      - workflow-imported-root-guard
      - workflow-locality-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - id: toolchain
        name: Load pinned Zig metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/zig-toolchain.env
          echo "version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - name: Verify resolved Zig version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = "${{ steps.toolchain.outputs.version }}"
      - id: zig-build-cache
        name: Restore Linux firmware Zig build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-linux-firmware-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}
          restore-keys: |
            zig-build-linux-firmware-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-${{ github.ref_name }}-
            zig-build-linux-firmware-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.ZIG_BUILD_CACHE_VERSION }}-
      - id: xlsxio-ref
        name: Resolve xlsxio upstream HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote https://github.com/brechtsanders/xlsxio.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: xlsxio-cache
        name: Restore Linux xlsxio helper cache for firmware lane
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/xlsxio-prefix
          key: xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-${{ env.XLSXIO_HELPER_CACHE_VERSION }}
          restore-keys: |
            xlsxio-${{ runner.os }}-${{ runner.arch }}-${{ steps.xlsxio-ref.outputs.sha }}-
            xlsxio-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux xlsxio helper prerequisites for firmware lane
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners preconfigure Microsoft/azure-cli apt repos that
          # intermittently fail signature checks (Clearsigned 'NOSPLIT') and abort
          # apt-get update; none of our prerequisites need them, so drop those
          # third-party source lists before updating.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list || true
          sudo apt-get update -qq
          sudo apt-get install -qq -y git pkgconf build-essential cmake libexpat1-dev libminizip-dev
      - name: Build xlsxio helper for firmware lane
        if: steps.xlsxio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/brechtsanders/xlsxio.git "$RUNNER_TEMP/xlsxio"
          cmake_version="$(cmake --version | sed -n '1s/^cmake version //p')"
          cmake_major="${cmake_version%%.*}"
          cmake_policy_args=()
          if [[ "$cmake_major" =~ ^[0-9]+$ && "$cmake_major" -ge 4 ]]; then
            cmake_policy_args+=( -DCMAKE_POLICY_VERSION_MINIMUM=3.5 )
          fi
          cmake -S "$RUNNER_TEMP/xlsxio" -B "$RUNNER_TEMP/xlsxio/build" \
            "${cmake_policy_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCUMENTATION:BOOL=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/xlsxio-prefix"
          cmake --build "$RUNNER_TEMP/xlsxio/build" --parallel
          cmake --install "$RUNNER_TEMP/xlsxio/build"
      - name: Install remaining Linux firmware and packaging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -qq -y libfreetype6-dev libgmp-dev libgtk-3-dev libpulse-dev gcc-arm-none-eabi
      - name: Run Linux firmware validation and package publication surface
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xlsxio-prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/xlsxio-prefix/lib:$RUNNER_TEMP/xlsxio-prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          zig build dmcp
          zig build dmcpr47
          zig build dmcp5
          zig build dmcp5r47
          zig build dist_dmcp
          zig build dist_dmcp_pkg1
          zig build dist_dmcp_pkg2
          zig build dist_dmcp_pkg3
          zig build dist_dmcpr47
          zig build dist_dmcp5
          zig build dist_dmcp5r47
      - id: linux_firmware_meta
        name: Set Linux firmware artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/project/upstream-pin.env
          upstream_short="${UPSTREAM_COMMIT:0:12}"
          echo "upstream_url=$UPSTREAM_REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=z47-firmware-$upstream_short" >> "$GITHUB_OUTPUT"
      - name: Stage Linux firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          firmware_dir="ci-artifacts/firmware"
          rm -rf "$firmware_dir"
          mkdir -p "$firmware_dir"
          cp zig-out/dist/c47-dmcp.zip "$firmware_dir/"
          cp zig-out/dist/c47-dmcp-pkg1.zip "$firmware_dir/"
          cp zig-out/dist/c47-dmcp-pkg2.zip "$firmware_dir/"
          cp zig-out/dist/c47-dmcp-pkg3.zip "$firmware_dir/"
          cp zig-out/dist/c47-dmcp5.zip "$firmware_dir/"
          find "$firmware_dir" -maxdepth 1 -type f | sed "s#^$firmware_dir/##" | sort > "$firmware_dir/FIRMWARE-CONTENTS.txt"
          cat > "$firmware_dir/BUILD-METADATA.txt" <<EOF
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          upstream_url=${{ steps.linux_firmware_meta.outputs.upstream_url }}
          upstream_commit=${{ steps.linux_firmware_meta.outputs.upstream_commit }}
          firmware_archives=c47-dmcp.zip,c47-dmcp-pkg1.zip,c47-dmcp-pkg2.zip,c47-dmcp-pkg3.zip,c47-dmcp5.zip
          artifact_name=${{ steps.linux_firmware_meta.outputs.artifact_name }}
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.linux_firmware_meta.outputs.artifact_name }}
          path: ci-artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

  macos-host-build:
