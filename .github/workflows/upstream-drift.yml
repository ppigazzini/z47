name: upstream-drift

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  zig-c-boundary-guard:
    name: Verify curated Zig/C boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce approved Zig/C boundary files
        shell: bash
        run: |
          set -euo pipefail
          bash .github/project/check-zig-c-boundaries.sh

  drift:
    runs-on: ubuntu-latest
    needs:
      - zig-c-boundary-guard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Report pinned upstream drift
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 .github/project/report-upstream-refresh.py --repo-root . --fetch > upstream-drift.txt; then
            . ./.github/project/upstream-pin.env
            {
              echo "Pinned upstream commit: $UPSTREAM_COMMIT"
              echo "Current upstream HEAD: unavailable"
              echo "Status: query failed"
            } > upstream-drift.txt
            echo "::warning::Unable to query current upstream HEAD"
            exit 0
          fi
          current_commit="$(awk -F': ' '/^Current upstream HEAD:/ {print $2; exit}' upstream-drift.txt)"
          status="$(awk -F': ' '/^Status:/ {print $2; exit}' upstream-drift.txt)"
          if [[ "$status" == "upstream has moved" ]]; then
            echo "::warning::Upstream HEAD moved to $current_commit"
          elif [[ "$status" == "comparison head diverged from pinned commit" ]]; then
            echo "::warning::Pinned upstream commit is not an ancestor of the comparison head"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift
          path: upstream-drift.txt
