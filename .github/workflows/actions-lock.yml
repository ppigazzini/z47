# Verify .github/workflows/actions.lock. Every action a workflow uses, and every
# action those actions use, must be locked to the commit recorded there, and each
# locked commit must still resolve upstream. The workflows also pin each action
# to that commit (check-action-pins.py holds them to it), so the lockfile is a
# second, independently checked record and the runner refuses a pin it does not
# list.
#
# The weekly run catches a locked commit that stops verifying upstream, such as
# a deleted tag or a force-pushed or renamed repository, with no push to
# trigger it.
#
# Regenerate after moving a pin: gh actions-lock --no-interactive --no-narrow
# (--no-narrow keeps the workflows' commit pins instead of rewriting them as
# version tags).
name: actions-lock

on:
  push:
    branches: [main, github_ci]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the actions lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify every workflow's locked actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify --no-interactive
